server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: resume-server
  profiles:
    active: dev

  # 数据源（MySQL 存储模式需要；json 存储模式仅用文件时可保留占位）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/resume_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}       # 环境变量注入，避免明文入库
    password: ${DB_PASSWORD:root}   # 环境变量注入，避免明文入库
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  # Redis 缓存（仅 resume.cache.type=redis 时需要，type=none 时可整体删除本段）
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8

  # 上传/请求体大小上限（含头像 JSON，预留富文本）
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # AI 模型连接（Spring AI，OpenAI 兼容协议直连 DeepSeek；无密钥时不创建 Bean，应用正常启动）
  ai:
    openai:
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      api-key: ${AI_API_KEY:}                       # 环境变量注入，不写明文
      chat:
        enabled: ${AI_ENABLED:true}
        options:
          model: ${AI_CHAT_MODEL:deepseek-flash}
          temperature: 0.7
      embedding:
        enabled: ${RAG_ENABLED:false}
        options:
          model: ${AI_EMBEDDING_MODEL:text-embedding-3-small}
      # 以下模型本应用不使用，显式关闭（避免创建无用 Bean）
      image:
        enabled: false
      audio:
        speech:
          enabled: false
        transcription:
          enabled: false
      # moderation 无 enabled 开关会被无条件创建，需非空 key 才不在启动时触发校验失败（占位值不会被调用）
      moderation:
        api-key: sk-placeholder

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-value: 0
      logic-not-delete-value: 1

# ------- 业务配置 -------
resume:
  storage:
    type: mysql                 # 存储后端: mysql | json
    json-path: ./data/resumes   # json 模式下的数据目录
    json-in-mysql: false        # 若为 true，json 模式也存 MySQL 的 JSON 列
  cache:
    type: none                  # 缓存后端: redis | none（none 表示不使用 Redis）
    ttl-seconds: 3600           # 简历详情缓存时长
    prefix: "resume:"
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3000"
  share:
    base-url: http://localhost:5173   # 短链域名
    default-ttl-days: 30              # 默认有效期（0=永久）
    seo:
      enabled: true                   # 分享页 SEO 元信息接口开关
      og-image-default: ""            # 兜底 og:image 地址
  community:
    sensitive-words:                 # 敏感词库（命中即拒绝发布）
      - 广告
      - 刷单
      - 赌博
      - 博彩
      - 色情
      - 诈骗
      - 代开发票
      - 办证
    report-review-threshold: 5       # 举报数阈值→转人工复审
    like-review-threshold: 1000      # 点赞阈值→热帖复审
    view-review-threshold: 10000     # 浏览阈值→热帖复审
  watermark:
    enabled: true                    # 水印总开关（按需启动）
    visible:
      text: "{user}_{date}"          # 可视水印文案（{user}/{date}/{device} 占位）
      opacity: 0.08                  # 透明度
      density: medium                # light/medium/heavy
    blind:
      enabled: true                  # 盲水印（LSB 像素级溯源）
      payload: "user_id|device_id"   # 编码进图的信息
  public-rate-limit:
    enabled: false                   # 公开接口（分享查看/社区信息流）限流开关
    limit: 60                        # 每窗口上限
    window-seconds: 60               # 窗口时长（秒）

# ------- 消息队列（R10-O1） -------
mq:
  type: ${MQ_TYPE:memory}            # stream | kafka | rabbitmq | memory；stream=Redis Stream(需 Redis 5.0+)；当前环境 Redis 3.2 不支持，默认 memory 降级，升级后设 MQ_TYPE=stream
  redis:
    stream-prefix: "mq:stream:"      # Stream key 前缀
    group-prefix: "mq:group:"        # 消费者组前缀
    consumer-prefix: "mq:consumer:"  # 消费者名前缀（多实例唯一）
    block-ms: 2000                   # XREADGROUP 阻塞时长
    retry-max: 3                     # 单条消息最大重试次数（超限转死信）
    claim-idle-ms: 30000             # 卡死判定闲置阈值，触发 XCLAIM 重投
    dead-letter: true                # 启用死信队列（后缀 :dlq）
    retry-interval-ms: 5000          # 重试扫描间隔

# ------- 埋点/统计（R10-O2） -------
stats:
  async:
    enabled: true                    # 埋点异步化开关（false 同步直写）

# ------- 检索（R10-O4） -------
search:
  engine: ${SEARCH_ENGINE:elasticsearch}  # mysql | elasticsearch（默认 ES；ES 不可用时检索自动降级 MySQL LIKE，如需强制 LIKE 设 SEARCH_ENGINE=mysql）
  elasticsearch:
    url: ${ES_URL:http://localhost:9200}
    index-prefix: ${ES_INDEX_PREFIX:resume_gen_}
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
    auto-create-index: true          # 启动时自动建索引（含 IK 分词 mapping）

# ------- AI 能力层（R5/R6，可开关降级） -------
ai:
  enabled: ${AI_ENABLED:true}           # AI 总开关：true 时启用真实 AI 调用（默认开启，可用 AI_ENABLED=false 关闭）
  provider: ${AI_PROVIDER:deepseek}     # deepseek | openai | qwen（OpenAI 兼容协议均可）
  max-context-chars: 8000               # 拼入 prompt 的最大字符数（防超长上下文）
  timeout-seconds: 60                   # 单次 LLM 调用超时（秒），超时即失败释放线程
  circuit-breaker:                      # 熔断：连续失败短路，避免雪崩
    enabled: true
    failure-threshold: 5                # 连续失败次数阈值
    open-seconds: 30                    # 熔断打开后短路时长（秒）
  rate-limit:                           # 单用户频控（enabled=false 时不限流）
    enabled: ${AI_RATE_LIMIT_ENABLED:false}
    window-seconds: 60                  # 固定窗口时长（秒）
    limit: 20                           # 默认每窗口上限
    per-type:                           # 按任务类型覆盖（高成本任务额度更低）
      interview.generate: 3
      resume.score: 10
  react:
    enabled: ${AI_REACT_ENABLED:true}   # R5/R6 是否启用「预规划 + ReAct」范式；false 时退化为单次直出
    max-iterations: 4                   # ReAct 最大推理轮次
  async:
    enabled: ${AI_ASYNC_ENABLED:true}   # 是否启用异步双队列；true 时生成走 /api/ai/**/async 提交，返回 taskId
    high:
      concurrency: 8                    # 高成本队列（interview.generate / resume.suggest），资源多
    low:
      concurrency: 3                    # 低成本队列（resume.rewrite / resume.expand），资源少

rag:
  enabled: ${RAG_ENABLED:false}         # 是否启用检索增强（false 跳过检索直连 LLM）
  store:
    type: ${RAG_STORE_TYPE:memory}      # memory | redis | pgvector
  top-k: 5                              # 相似检索返回条数
  min-score: 0.65                       # 相似度阈值，低于不给上下文

# JWT
jwt:
  secret: "please-change-me-to-a-long-random-secret-at-least-32-chars"
  expire-seconds: 86400         # 令牌有效期（秒）
  header: Authorization
  token-prefix: "Bearer "