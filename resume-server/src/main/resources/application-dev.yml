# 开发环境配置
#
# ⚠️ 本文件随仓库提交，禁止写入任何明文敏感信息（数据库密码、API Key、JWT 密钥等）。
# 本地开发请通过环境变量注入（IDE 运行配置 / 系统环境变量均可）：
#   DB_USER / DB_PASSWORD   MySQL 账号密码
#   AI_API_KEY              大模型 API Key（留空时 AI 能力自动降级，不影响应用启动）
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/resume_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  ai:
    openai:
      api-key: ${AI_API_KEY:}

resume:
  storage:
    type: mysql        # 开发默认 MySQL；可改为 json 以文件方式运行
  cache:
    type: none         # 开发默认不依赖 Redis
